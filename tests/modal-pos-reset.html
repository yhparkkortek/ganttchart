<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>모달 위치 기억·초기화·넓은 모달 기본 위치 시험</title></head><body style="margin:0">
<!-- 📐 [2026-11-25] 진짜 kortek_pm.html, 진짜 여는 함수·진짜 ⚙️ 메뉴 버튼. 가짜는 showToast 하나(글을 받아 본다).
     ① 기억된 자리로 열린다 ② 메뉴 [🪟 모달 위치 초기화] → 열린 넓은 모달이 기본 자리로, 저장 비움, 토스트
     ③ 다시 열어도 기본 자리(다시 만드는 모달 — JIRA 검색) ④ 다른 넓은 모달(자재 보관함)도 같은 자리 ⑤ 목록 밖 모달(알람 설정)은 원래 크기 ⑥~⑧ 붙은 동안 페이지 비킴·닫으면 되돌림·옮긴 창은 안 비킴
     실행: chrome --headless=new --allow-file-access-from-files --window-size=2000,1100 --virtual-time-budget=30000
           --dump-dom file:///.../tests/modal-pos-reset.html → <pre id="out"> (마지막 줄 N/M) -->
<iframe id="f" src="../kortek_pm.html?mpr=1" style="border:0;width:2000px;height:1100px;"></iframe>
<pre id="out">running…</pre>
<script>
var out = [], pass = 0, fail = 0;
function chk(c, l) { c ? pass++ : fail++; out.push((c ? 'ok   ' : 'FAIL ') + l); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
f.onload = async function () {
  await sleep(2500);
  var W = f.contentWindow, D = f.contentDocument, toasts = [];
  try {
    W.showToast = function (m) { toasts.push(m); };
    var KEY = W.MODAL_POS_POLICY.key, saved = W.localStorage.getItem(KEY);
    function R(id) { var b = D.getElementById(id); if (!b) return null; var r = b.getBoundingClientRect(); return [r.left, r.top, r.width, r.height].map(Math.round); }
    function same(a, b) { return a && b && a.every(function (v, i) { return Math.abs(v - b[i]) <= 1; }); }
    function hide(id) { var m = D.getElementById(id); if (m) m.style.display = 'none'; }
    var fr = W._modalFitRect(), FIT = [fr.l, fr.t, fr.w, fr.h];
    W.localStorage.setItem(KEY, JSON.stringify({ 'jira-search-box': { l: 300, t: 200, w: 700, h: 500 } }));
    W._jiraOpenSearchModal(); await sleep(700);
    chk(same(R('jira-search-box'), [300, 200, 700, 500]), '① 기억된 자리로 열린다 — ' + R('jira-search-box'));
    D.getElementById('settings-menu-btn').click(); await sleep(200);
    D.getElementById('modal-pos-reset-btn').click(); await sleep(400);
    chk(same(R('jira-search-box'), FIT), '② 열린 채 초기화 → 기본 자리 ' + FIT + ' — ' + R('jira-search-box'));
    chk(W.localStorage.getItem(KEY) === null, '② 저장 비움');
    chk(toasts.some(function (t) { return /1개/.test(t); }), '② 토스트 — ' + toasts.join(' | '));
    hide('jira-search-modal'); await sleep(300); W._jiraOpenSearchModal(); await sleep(700);
    chk(same(R('jira-search-box'), FIT), '③ 다시 열어도 기본 자리 — ' + R('jira-search-box'));
    hide('jira-search-modal'); await sleep(300); W._mcOpen(); await sleep(700);
    chk(same(R('matcart-box'), FIT), '④ 자재 보관함도 같은 자리 — ' + R('matcart-box'));
    hide('matcart-modal'); await sleep(300); W.openAlarmSettings(); await sleep(700);
    var al = R('alarm-settings-modal');
    chk(al && al[2] < 700, '⑤ 목록 밖 모달은 원래 크기 — ' + al);
    // ⑥~⑧ 붙어 있는 동안 페이지가 비킨다(겹치지 않게), 닫으면 되돌린다, 옮겨 둔 자리면 안 비킨다
    var M = D.getElementById('app-main');
    hide('alarm-settings-overlay'); hide('alarm-settings-modal'); await sleep(300);
    W.localStorage.removeItem(KEY); W._mcOpen(); await sleep(700);
    var hb = [].slice.call(D.querySelectorAll('#app-main .concept-header-box')).find(function (h) { return h.offsetWidth; });
    var mb = D.getElementById('matcart-box').getBoundingClientRect();
    chk(M.style.paddingRight !== '' && hb && hb.getBoundingClientRect().right <= mb.left - 5, '⑥ 붙은 모달 옆으로 페이지가 비킨다 — 여백 ' + M.style.paddingRight + ' · 페이지 끝 ' + (hb && Math.round(hb.getBoundingClientRect().right)) + ' · 모달 ' + Math.round(mb.left));
    hide('matcart-modal'); await sleep(400);
    chk(M.style.paddingRight === '', '⑦ 닫으면 페이지 원래 폭 — "' + M.style.paddingRight + '"');
    W.localStorage.setItem(KEY, JSON.stringify({ 'matcart-box': { l: 400, t: 200 } })); W._mcOpen(); await sleep(700);
    chk(M.style.paddingRight === '', '⑧ 옮겨 둔 자리(떠 있는 창)면 페이지를 안 비킨다 — "' + M.style.paddingRight + '"');
    hide('matcart-modal'); await sleep(300);
    // ⑨ 화면 전체를 쓰는 페이지(간트·프로젝트 목록)에선 비키지 않는다, 돌아오면 다시 비킨다
    W.localStorage.removeItem(KEY); W.switchTab('briefspec'); await sleep(300); W._mcOpen(); await sleep(700);
    var p1 = M.style.paddingRight; W.switchTab('gantt'); await sleep(300); var p2 = M.style.paddingRight;
    W.switchTab('projectlist'); await sleep(300); var p3 = M.style.paddingRight; W.switchTab('calendar'); await sleep(300); var p3c = M.style.paddingRight; W.switchTab('briefspec'); await sleep(300); var p4 = M.style.paddingRight;
    chk(p1 !== '' && p2 === '' && p3 === '' && p3c === '' && p4 === p1, '⑨ 간트·프로젝트 목록·캘린더에선 안 비킨다 — 고객사양 "' + p1 + '" · 간트 "' + p2 + '" · 목록 "' + p3 + '" · 다시 고객사양 "' + p4 + '"');
    hide('matcart-modal'); await sleep(300);
    if (saved === null) W.localStorage.removeItem(KEY); else W.localStorage.setItem(KEY, saved);
  } catch (e) { out.push('SETUP ' + e.message); }
  out.push(pass + '/' + (pass + fail));
  document.getElementById('out').textContent = out.join('\n');
};
</script></body></html>
