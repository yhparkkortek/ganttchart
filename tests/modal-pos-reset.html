<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>모달 위치 기억·초기화·넓은 모달 기본 위치 시험</title></head><body style="margin:0">
<!-- 📐 [2026-11-25] 진짜 kortek_pm.html, 진짜 여는 함수·진짜 ⚙️ 메뉴 버튼. 가짜는 showToast 하나(글을 받아 본다).
     ① 기억된 자리로 열린다 ② 메뉴 [🪟 모달 위치 초기화] → 열린 넓은 모달이 기본 자리로, 저장 비움, 토스트
     ③ 다시 열어도 기본 자리(다시 만드는 모달 — JIRA 검색) ④ 다른 넓은 모달(자재 보관함)도 같은 자리 ⑤ 목록 밖 모달(알람 설정)은 원래 크기 ⑥~⑧ 붙은 동안 페이지 비킴·닫으면 되돌림·옮긴 창은 안 비킴 ⑨ 모든 페이지에서 모달과 안 겹침(폭이 정해진 페이지는 빈 공간만큼만 모달) ⑩ 프로젝트 탭 줄이 생기면 그 아래로
     실행: chrome --headless=new --allow-file-access-from-files --window-size=2000,1100 --virtual-time-budget=30000
           --dump-dom file:///.../tests/modal-pos-reset.html → <pre id="out"> (마지막 줄 N/M) -->
<iframe id="f" src="../kortek_pm.html?mpr=1" style="border:0;width:2000px;height:1100px;"></iframe>
<pre id="out">running…</pre>
<script>
var out = [], pass = 0, fail = 0;
function chk(c, l) { c ? pass++ : fail++; out.push((c ? 'ok   ' : 'FAIL ') + l); document.getElementById('out').textContent = out.join('\n') + '\n…'; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
f.onload = async function () {
  await sleep(2500);
  var W = f.contentWindow, D = f.contentDocument, toasts = [];
  try {
    W.showToast = function (m) { toasts.push(m); };
    var KEY = W.MODAL_POS_POLICY.key, saved = W.localStorage.getItem(KEY);
    function R(id) { var b = D.getElementById(id); if (!b) return null; var r = b.getBoundingClientRect(); return [r.left, r.top, r.width, r.height].map(Math.round); }
    function same(a, b) { return a && b && a.every(function (v, i) { return Math.abs(v - b[i]) <= 1; }); }
    function hide(id) { var m = D.getElementById(id); if (m) m.style.display = 'none'; }
    var fr = W._modalFitRect(), FIT = [fr.l, fr.t, fr.w, fr.h];
    W.localStorage.setItem(KEY, JSON.stringify({ 'jira-search-box': { l: 300, t: 200, w: 700, h: 500 } }));
    W._jiraOpenSearchModal(); await sleep(700);
    chk(same(R('jira-search-box'), [300, 200, 700, 500]), '① 기억된 자리로 열린다 — ' + R('jira-search-box'));
    D.getElementById('settings-menu-btn').click(); await sleep(200);
    D.getElementById('modal-pos-reset-btn').click(); await sleep(400);
    chk(same(R('jira-search-box'), FIT), '② 열린 채 초기화 → 기본 자리 ' + FIT + ' — ' + R('jira-search-box'));
    chk(W.localStorage.getItem(KEY) === null, '② 저장 비움');
    chk(toasts.some(function (t) { return /1개/.test(t); }), '② 토스트 — ' + toasts.join(' | '));
    hide('jira-search-modal'); await sleep(300); W._jiraOpenSearchModal(); await sleep(700);
    chk(same(R('jira-search-box'), FIT), '③ 다시 열어도 기본 자리 — ' + R('jira-search-box'));
    hide('jira-search-modal'); await sleep(300); W._mcOpen(); await sleep(700);
    chk(same(R('matcart-box'), FIT), '④ 자재 보관함도 같은 자리 — ' + R('matcart-box'));
    hide('matcart-modal'); await sleep(300); W.openAlarmSettings(); await sleep(700);
    var al = R('alarm-settings-modal');
    chk(al && al[2] < 700, '⑤ 목록 밖 모달은 원래 크기 — ' + al);
    // ⑥~⑧ 붙어 있는 동안 페이지가 비킨다(겹치지 않게), 닫으면 되돌린다, 옮겨 둔 자리면 안 비킨다
    var M = D.getElementById('app-main');
    hide('alarm-settings-overlay'); hide('alarm-settings-modal'); await sleep(300);
    W.localStorage.removeItem(KEY); W._mcOpen(); await sleep(700);
    var hb = [].slice.call(D.querySelectorAll('#app-main .concept-header-box')).find(function (h) { return h.offsetWidth; });
    var mb = D.getElementById('matcart-box').getBoundingClientRect();
    chk(M.style.paddingRight !== '' && hb && hb.getBoundingClientRect().right <= mb.left - 5, '⑥ 붙은 모달 옆으로 페이지가 비킨다 — 여백 ' + M.style.paddingRight + ' · 페이지 끝 ' + (hb && Math.round(hb.getBoundingClientRect().right)) + ' · 모달 ' + Math.round(mb.left));
    hide('matcart-modal'); await sleep(400);
    chk(M.style.paddingRight === '', '⑦ 닫으면 페이지 원래 폭 — "' + M.style.paddingRight + '"');
    W.localStorage.setItem(KEY, JSON.stringify({ 'matcart-box': { l: 400, t: 200 } })); W._mcOpen(); await sleep(700);
    chk(M.style.paddingRight === '', '⑧ 옮겨 둔 자리(떠 있는 창)면 페이지를 안 비킨다 — "' + M.style.paddingRight + '"');
    hide('matcart-modal'); await sleep(300);
    // ⑨ 모달을 연 채 탭을 오가도 모든 페이지가 똑같이 비킨다(화면 전체를 쓰는 페이지 포함 — 사용자 결정)
    W.localStorage.removeItem(KEY); W.switchTab('briefspec'); await sleep(300); W._mcOpen(); await sleep(700);
    var res = {}, okAll = true;
    for (const tab of ['briefspec', 'gantt', 'projectlist', 'calendar', 'weekly']) {
        W.switchTab(tab); await sleep(400);
        var pg = D.getElementById('tab-' + tab), el = tab === 'gantt' ? D.getElementById('table-container') : tab === 'projectlist' ? D.getElementById('pl-table-wrap') : pg.querySelector('.concept-tab-wrap');
        var pe = Math.round(el.getBoundingClientRect().right), ml = Math.round(D.getElementById('matcart-box').getBoundingClientRect().left);
        res[tab] = pe + '<' + ml; if (!(pe <= ml - 5)) okAll = false;
    }
    chk(okAll, '⑨ 모든 페이지에서 페이지 끝이 모달 왼쪽 — ' + JSON.stringify(res));
    hide('matcart-modal'); await sleep(400); W.switchTab('calendar'); await sleep(300);
    chk(M.style.paddingRight === '', '⑨ 닫으면 캘린더도 원래 폭 — "' + M.style.paddingRight + '"');
    W.switchTab('briefspec'); await sleep(300);
    // ⑩ 붙은 채 프로젝트 탭 줄이 생기면(프로젝트 열기) 그 아래로 다시 붙는다, 사라지면 원래 위로
    W.localStorage.removeItem(KEY); W._mcOpen(); await sleep(700);
    var t0 = Math.round(D.getElementById('matcart-box').getBoundingClientRect().top);
    var bar = D.getElementById('sheet-tabs-bar'), oldDisp = bar.style.display, oldHtml = bar.innerHTML;
    bar.innerHTML = '<div style="height:30px; padding:4px 10px; border:1px solid #ccc;">TEST_PROJECT</div>'; bar.style.display = 'flex'; await sleep(400);
    var bb = Math.round(bar.getBoundingClientRect().bottom), t1 = Math.round(D.getElementById('matcart-box').getBoundingClientRect().top);
    bar.style.display = oldDisp; bar.innerHTML = oldHtml; await sleep(400);
    var t2 = Math.round(D.getElementById('matcart-box').getBoundingClientRect().top);
    chk(t1 >= bb && t2 === t0, '⑩ 프로젝트 탭 줄 아래로 다시 붙음 — 처음 ' + t0 + ' · 탭 줄 끝 ' + bb + ' → ' + t1 + ' · 탭 줄 없앰 → ' + t2);
    hide('matcart-modal'); await sleep(300);
    // ⑪ 페이지에서 여는 내용 모달(캘린더 날짜 목록·알람 상세·알람 일정·공지 등록)도 맞춤 자리 + 버튼이 상자 안에
    var cases = [
      ['calendar', 'cal-day-popup-modal', function () { D.getElementById('cal-day-popup-overlay').style.display = 'flex'; }, function () { hide('cal-day-popup-overlay'); }],
      ['alarm', 'alarm-modal', function () { D.getElementById('alarm-modal-body').innerHTML = new Array(80).join('<p>긴 업무 내용 줄</p>'); D.getElementById('alarm-modal-overlay').style.display = 'flex'; D.getElementById('alarm-modal').style.display = 'flex'; }, function () { W.closeAlarmModal(); }],
      ['alarm', 'alarm-schedule-modal', function () { D.getElementById('alarm-schedule-overlay').style.display = 'flex'; D.getElementById('alarm-schedule-modal').style.display = 'flex'; }, function () { hide('alarm-schedule-overlay'); hide('alarm-schedule-modal'); }],
      ['alarm', 'inbox-mailraw-box', function () { W.showMailRawModal({ subject: '시험 메일', sender: 'a@b', date: '2026-11-26', body: new Array(200).join('본문 줄\n') }); }, function () { hide('inbox-mailraw-modal'); }],
      ['document', 'respick-box', function () { W.resOpenPicker({}); }, function () { hide('respick-overlay'); }],
      ['alarm', 'notice-modal', function () { W.openNoticeModal(); }, function () { hide('notice-modal'); hide('notice-modal-bg'); }]
    ];
    for (const c of cases) {
        W.localStorage.removeItem(KEY); W.switchTab(c[0]); await sleep(300);
        c[2](); await sleep(700);
        // 열 때 0.2초 떠오르는 애니메이션(.history-modal fadeIn)은 헤드리스 가상 시간에선 끝나지 않는다 — 끝낸 뒤 잰다
        D.getElementById(c[1]).getAnimations().forEach(function (an) { try { an.finish(); } catch (e) {} });
        var f2 = W._modalFitRect(), want = [f2.l, f2.t, f2.w, f2.h], got = R(c[1]);
        var bx = D.getElementById(c[1]).getBoundingClientRect();
        var btns = [].slice.call(D.getElementById(c[1]).querySelectorAll('button')).filter(function (b) { return b.offsetWidth; });
        var lastB = btns.length ? Math.round(btns[btns.length - 1].getBoundingClientRect().bottom) : 0;
        chk(same(got, want) && lastB <= Math.round(bx.bottom) && M.style.paddingRight !== '', '⑪ ' + c[0] + ' ▸ ' + c[1] + ' 맞춤 ' + want + ' — ' + got + ' · 마지막 버튼 끝 ' + lastB + ' ≤ 상자 끝 ' + Math.round(bx.bottom) + ' · 페이지 비킴 ' + M.style.paddingRight);
        c[3](); await sleep(400);
    }
    chk(M.style.paddingRight === '', '⑪ 다 닫으면 원래 폭 — "' + M.style.paddingRight + '"');
    W.switchTab('briefspec'); await sleep(300);
    if (saved === null) W.localStorage.removeItem(KEY); else W.localStorage.setItem(KEY, saved);
  } catch (e) { out.push('SETUP ' + e.message); }
  out.push(pass + '/' + (pass + fail));
  document.getElementById('out').textContent = out.join('\n');
};
</script></body></html>
