<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>hdr-find widget test</title>
<!-- 🔍 헤더 찾기 위젯(js/22b _hdrFindWidget) 시험 — 진짜 js/04a(검색 규칙)·js/22b(위젯)를 불러 실제 브라우저 엔진에서 돌린다.
     실행: chrome --headless=new --allow-file-access-from-files --dump-dom file:///.../tests/hdr-find-widget.html
     결과는 <pre id="out"> 에 적힌다(마지막 줄 N/M). -->
<link rel="stylesheet" href="../styles.css">
</head><body>
<div class="concept-tab-wrap" id="tab-x"><div class="concept-header-box" id="hdr">
  <h2>Test</h2><div class="btn-group"><button>📊 엑셀 저장</button></div>
</div></div>
<pre id="out"></pre>
<script src="../js/04a-core-app-globals.js"></script>
<script src="../js/22b-summary-mctable-core1.js"></script>
<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function chk(c, l) { c ? pass++ : fail++; out.push((c ? 'ok   ' : 'FAIL ') + l); }
  try {
    var hdr = document.getElementById('hdr');
    var w = window._hdrFindWidget({ inputId: 'x-in', countId: 'x-cnt', ko: '🔍 찾기', nav: { prevId: 'x-prev', nextId: 'x-next' } });
    window._hdrFindMount(hdr, w.el);
    var btn = w.el.querySelector('.hdr-find-btn'), pop = w.el.querySelector('.hdr-find-pop');
    chk(hdr.children[1] === w.el && hdr.children[2].classList.contains('btn-group'), '헤더의 .btn-group 바로 앞에 붙는다');
    chk(btn.getBoundingClientRect().height === 31, '버튼 높이 31px (헤더 층) — ' + btn.getBoundingClientRect().height);
    chk(getComputedStyle(pop).display === 'none', '처음엔 상자가 닫혀 있다');
    var hdrW0 = hdr.scrollWidth;
    btn.click();
    chk(getComputedStyle(pop).display === 'flex' && document.activeElement === w.input, '누르면 상자가 열리고 칸에 커서');
    chk(getComputedStyle(pop).position === 'fixed' && hdr.scrollWidth === hdrW0, '상자는 fixed — 헤더 폭을 안 늘린다');
    var pr = pop.getBoundingClientRect(), br = btn.getBoundingClientRect();
    chk(pr.top >= br.bottom && pr.top - br.bottom <= 6, '상자는 버튼 바로 아래');
    chk(!!document.getElementById('x-prev') && !!document.getElementById('x-next'), '▲▼ 가 있다(nav)');
    w.input.value = 'abc'; w.input.dispatchEvent(new Event('input'));
    chk(btn.textContent === '🔍 …', '찾는 중이면 버튼이 🔍 … — ' + btn.textContent);
    w.count.textContent = '3 / 12';
    setTimeout(function () {
      chk(btn.textContent === '🔍 3 / 12', '개수가 바뀌면 버튼 글자에 따라 쓴다 — ' + btn.textContent);
      document.body.click();
      chk(getComputedStyle(pop).display === 'none', '바깥을 누르면 닫힌다(찾기는 유지)');
      chk(btn.textContent === '🔍 3 / 12', '닫아도 버튼이 찾는 중임을 보여 준다');
      btn.click(); w.input.value = ''; w.input.dispatchEvent(new Event('input')); w.count.textContent = '';
      setTimeout(function () {
        chk(btn.textContent === '🔍', '지우면 버튼이 🔍 로 돌아온다');
        w.input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        chk(getComputedStyle(pop).display === 'none', '빈 칸에서 Esc 는 상자를 닫는다');
        chk(!/rgb\(/.test(btn.getAttribute('style') || ''), '버튼 색을 JS 로 칠하지 않는다(팔레트가 정한다)');
        out.push(pass + '/' + (pass + fail));
        document.getElementById('out').textContent = out.join('\n');
      }, 30);
    }, 30);
  } catch (e) { out.push('ERROR ' + e.message); document.getElementById('out').textContent = out.join('\n'); }
})();
</script>
</body></html>
