<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>간트 날짜 찾기 · 📅 오늘 버튼 시험</title></head><body style="margin:0">
<!-- 📅 [2026-11-25] 간트 찾기의 날짜 검색 + 헤더 📅 오늘 버튼 — 진짜 kortek_pm.html 을 iframe 으로 띄워
     합성 간트(접힌 WBS 포함)를 진짜 recalculateSchedules()/renderTable 로 그리고, 진짜 버튼을 누른다.
     가짜는 없다(저장은 프로젝트가 안 열려 있어 돌지 않는다 — 프로젝트가 열린 탭에서 돌리지 말 것).
     실행: chrome --headless=new --allow-file-access-from-files --window-size=1500,900 --virtual-time-budget=30000
           --dump-dom file:///.../tests/gantt-today-search.html   → <pre id="out"> (마지막 줄 N/M) -->
<iframe id="f" src="../kortek_pm.html?gtoday=1" style="border:0;width:1400px;height:800px;"></iframe>
<pre id="out">running…</pre>
<script>
var out = [], pass = 0, fail = 0;
function chk(c, l) { c ? pass++ : fail++; out.push((c ? 'ok   ' : 'FAIL ') + l); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function ymd(off) { var d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
var f = document.getElementById('f');
f.onload = async function () {
  await sleep(2500);
  var W = f.contentWindow, D = f.contentDocument;
  try {
    if (W.currentDriveFileId) { out.push('SKIP 프로젝트가 열려 있다'); throw new Error('skip'); }
    D.querySelectorAll('[id$="-overlay"],[id$="-modal"]').forEach(function (x) { if (x.style) x.style.display = 'none'; });
    W.switchTab('gantt'); await sleep(300);
    // 헤더 / 열 — 엑셀 불러오기(js/04f)가 만드는 모양 그대로
    var head = ['NO', 'LEVEL(WBS)', '개발단계', '업무1', '업무2', '시작일', '완료일', '업무상태', '상세내용'];
    W.colIdx = { no:0, bogo:1, start:5, plan:6, period:-1, dur1:-1, dur2:-1, dur3:-1, dur4:-1, assignee:-1, taskType1:3, taskType2:4, taskType3:-1, taskType4:-1, status:7, customer:-1, model:-1, inch:-1, devStage:2, content:8, answer:-1, chart:-1, wbs:-1 };
    function R(lv, d0, t1, t2, s, e, st, c) {
      var r = ['', String(lv), d0, t1, t2, s, e, st, c]; r._level = lv; r._origDev = lv === 0 ? d0 : ''; r._origT1 = lv === 1 ? t1 : ''; r._origT2 = lv === 2 ? t2 : ''; r._origT3 = ''; r._origT4 = ''; return r;
    }
    var gd = [head,
      R(0, 'PROTO', '', '', ymd(-30), ymd(30), '진행', ''),
      R(1, 'PROTO', '설계', '', ymd(-30), ymd(30), '진행', ''),
      R(2, 'PROTO', '설계', '지난업무', ymd(-20), ymd(-10), '완료', '지난 일'),
      R(2, 'PROTO', '설계', '오늘걸친업무', ymd(-2), ymd(2), '진행', '진행 중'),
      R(2, 'PROTO', '설계', '오늘하루업무', ymd(0), ymd(0), '진행', '회의'),
      R(2, 'PROTO', '설계', '다음업무', ymd(5), ymd(9), '대기', '오늘 이야기한 것'),   // "오늘" 이 글자로 든 다른 날 업무
      R(2, 'PROTO', '설계', '일월업무', '2026-01-10', '2026-01-12', '완료', '1월 건')];
    W.globalData = gd;
    gd[2]._wbsCollapsed = true;   // '설계' 접힘 — 오늘 업무가 그 안에 숨어 있다
    W.recalculateSchedules(); await sleep(600);
    function shown() {
      return [].slice.call(D.querySelectorAll('#table-body tr[data-row-index]')).filter(function (tr) { return tr.style.display !== 'none' && tr.getBoundingClientRect().height > 0; })
        .map(function (tr) { var r = W.globalData[+tr.getAttribute('data-row-index')]; return r._origT2 || r._origT1 || r._origDev; });
    }
    function hl(name) {   // 그 업무 줄에서 강조된 날짜 칸: 'S'(시작)·'E'(완료)
      var ci = W.colIdx, res = '';
      [].slice.call(D.querySelectorAll('#table-body tr[data-row-index]')).forEach(function (tr) {
        var r = W.globalData[+tr.getAttribute('data-row-index')]; if ((r._origT2 || r._origT1 || r._origDev) !== name) return;
        tr.querySelectorAll('span.gantt-search-hl-date').forEach(function (sp) {
          var m = sp.getAttribute('onclick').match(/,\s*(\d+)\)/); res += (+m[1] === ci.start ? 'S' : +m[1] === ci.plan ? 'E' : '?');
        });
      });
      return res;
    }
    var s0 = shown();
    chk(s0.indexOf('오늘하루업무') === -1 && s0.indexOf('오늘걸친업무') === -1, '처음엔 접혀서 오늘 업무가 안 보인다 — ' + s0.join(','));
    var btn = D.getElementById('gantt-today-btn');
    chk(!!btn && /오늘/.test(btn.textContent), '헤더에 📅 오늘 버튼');
    // 📅 [2026-11-26 변경] 오늘 버튼 = 거르지 않고 전체를 펼친 뒤 오늘 위치(시작일이 오늘 이후인 첫 하위 업무)로 이동
    var inp = D.getElementById('gantt-ai-search-input');
    W.ganttAiSearchToggle(); inp.value = '다음업무'; inp.dispatchEvent(new W.Event('input')); D.getElementById('gantt-search-now').click(); await sleep(400);
    chk(shown().indexOf('지난업무') === -1, '(준비) 검색이 걸려 다른 업무가 숨어 있다 — ' + shown().join(','));
    btn.click(); await sleep(500);
    var s1 = shown();
    chk(inp.value === '' && D.querySelectorAll('.gantt-search-hl-date').length === 0, '걸려 있던 검색을 푼다 — "' + inp.value + '"');
    chk(['지난업무', '오늘걸친업무', '오늘하루업무', '다음업무', '일월업무'].every(function (n) { return s1.indexOf(n) !== -1; }), '접힌 가지까지 전체 업무가 보인다 — ' + s1.join(','));
    chk(!W.globalData[2]._wbsCollapsed, '접혀 있던 WBS 가 펼쳐졌다');
    var fl = [].slice.call(D.querySelectorAll('#table-body tr.ai-ref-flash')).map(function (tr) { var r = W.globalData[+tr.getAttribute('data-row-index')]; return r._origT2 || r._origT1; });
    chk(fl.length === 1 && fl[0] === '오늘하루업무', '오늘 위치(시작일이 오늘 이후인 첫 업무)가 반짝인다 — ' + fl.join(','));
    var sb = D.getElementById('gantt-table-scroll'), th = D.getElementById('table-head'), tt = D.querySelector('#table-body tr.ai-ref-flash');
    var gap = Math.round(tt.getBoundingClientRect().top - sb.getBoundingClientRect().top - th.getBoundingClientRect().height);
    var canScroll = sb.scrollHeight > sb.clientHeight;
    chk(!canScroll || Math.abs(gap) <= 2 || sb.scrollTop + sb.clientHeight >= sb.scrollHeight - 2, '그 줄이 표 머리 바로 아래로 스크롤 — 간격 ' + gap + ' (스크롤 가능 ' + canScroll + ')');
    btn.click(); await sleep(500);
    chk(shown().length === s1.length && inp.value === '', '한 번 더 눌러도 같은 상태(토글 아님) — ' + shown().length);
    // 날짜 찾기 기본은 시작일만(2026-11-25 2차) — 아래 기대값(기간 한가운데·완료일로도 걸림)은 '기간 포함' 을 켠 상태
    var dsp = D.getElementById('gantt-ai-search-datespan'), dspWas = dsp.checked;
    if (!dsp.checked) dsp.click();
    var qs = [['2026-01-11', '일월업무', 'SE'], ["01/11'26", '일월업무', 'SE'], ['2026.01.10', '일월업무', 'S'], ['1월 12일', '일월업무', 'E']];
    for (var i = 0; i < qs.length; i++) {
      W.ganttAiSearchToggle && D.getElementById('gantt-ai-searchbar').style.display !== 'flex' && W.ganttAiSearchToggle();
      inp.value = qs[i][0]; inp.dispatchEvent(new W.Event('input'));
      D.getElementById('gantt-search-now').click(); await sleep(400);
      var s3 = shown();
      chk(s3.indexOf(qs[i][1]) !== -1 && s3.indexOf('오늘하루업무') === -1, '날짜를 쳐서 찾는다 "' + qs[i][0] + '" — ' + s3.join(','));
      chk(hl(qs[i][1]) === qs[i][2], '[강조] "' + qs[i][0] + '" → ' + qs[i][2] + ' — ' + hl(qs[i][1]));
    }
    if (dsp.checked !== dspWas) dsp.click();
    D.getElementById('gantt-ai-search-clear').click(); await sleep(300);
    // 📅 긴 목록(스크롤 필요 — 화면 밖 행은 자리표시) 에서도 오늘 위치가 표 머리 바로 아래로 오는가
    var big = [head, R(0, 'MP', '', '', ymd(-200), ymd(200), '진행', ''), R(1, 'MP', '묶음', '', ymd(-200), ymd(200), '진행', '')];
    for (var n = -120; n <= 120; n += 3) big.push(R(2, 'MP', '묶음', (n < 0 ? '과거' : '미래') + n, ymd(n), ymd(n + 1), '진행', ''));
    W.globalData = big; big[2]._wbsCollapsed = true; W.recalculateSchedules(); await sleep(600);
    btn.click(); await sleep(600);
    var sb2 = D.getElementById('gantt-table-scroll'), th2 = D.getElementById('table-head'), ft = D.querySelector('#table-body tr.ai-ref-flash');
    var fr2 = ft && W.globalData[+ft.getAttribute('data-row-index')];
    var gap2 = ft ? Math.round(ft.getBoundingClientRect().top - sb2.getBoundingClientRect().top - th2.getBoundingClientRect().height) : null;
    chk(fr2 && fr2._origT2 === '미래0' && sb2.scrollTop > 0 && gap2 !== null && Math.abs(gap2) <= 2 && !ft.hasAttribute('data-lazy'),
        '[긴 목록] 오늘 업무(미래0)가 표 머리 바로 아래 — ' + (fr2 && fr2._origT2) + ' · 간격 ' + gap2 + ' · scrollTop ' + sb2.scrollTop);
  } catch (e) { if (e.message !== 'skip') out.push('SETUP ' + e.message); }
  out.push(pass + '/' + (pass + fail));
  document.getElementById('out').textContent = out.join('\n');
};
</script></body></html>
