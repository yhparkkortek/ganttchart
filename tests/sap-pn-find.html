<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SAP KTK PN_모델명 찾기 시험</title></head><body style="margin:0">
<!-- 🏭 KTK PN_모델명 SAP 찾기(js/28 `_sapPnFind`) — 진짜 kortek_pm.html 을 iframe 으로 띄워, 새 프로젝트 마법사 4단계와
     Summary 모델 카드의 🏭 버튼을 진짜로 누른다. 가짜는 SAP 백엔드 fetch(`/sap-material-rows`·`/sap-material-pattern`) 하나.
     실행: chrome --headless=new --allow-file-access-from-files --window-size=1400,900 --virtual-time-budget=30000
           --dump-dom file:///.../tests/sap-pn-find.html   → <pre id="out"> (마지막 줄 N/M) -->
<iframe id="f" src="../kortek_pm.html?sappn=1" style="border:0;width:1366px;height:800px;"></iframe>
<pre id="out">running…</pre>
<script>
var out = [], pass = 0, fail = 0;
function chk(c, l) { c ? pass++ : fail++; out.push((c ? 'ok   ' : 'FAIL ') + l); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var f = document.getElementById('f');
f.onload = async function () {
  await sleep(2500);
  var W = f.contentWindow, D = f.contentDocument, calls = [];
  // 가짜 SAP — 내용(URL)으로 분기한다(호출 순서에 기대지 않는다)
  W.fetch = function (url) {
    url = String(url);
    if (url.indexOf('/sap-') !== -1) calls.push(url);   // 앱이 스스로 부르는 /health 등은 세지 않는다(그걸로 가짜 실패가 났다)
    var body;
    if (url.indexOf('/sap-material-rows') !== -1) {
      body = /materials=999999/.test(url) ? { ok: false, error: 'SAP 로그인이 필요합니다' }
           : { ok: true, materials: [{ MATNR: '000000502574', MAKTX: 'MAIN>KTS320DPS01,LNW' }] };
    } else if (url.indexOf('/sap-material-pattern') !== -1) {
      var pat = decodeURIComponent((url.split('pattern=')[1] || ''));
      // 대소문자 재시도 시험용: 'OBSIDIAN'(대문자)은 0건, 'Obsidian'(원래 글자)은 1건
      if (/OBSIDIAN/.test(pat)) body = { ok: true, materials: [] };
      else if (/Obsidian/.test(pat)) body = { ok: true, materials: [{ MATNR: '502700', MAKTX: 'Obsidian 27 MAIN' }] };
      else body = { ok: true, materials: [{ MATNR: '502574', MAKTX: 'MAIN>KTS320DPS01,LNW' }, { MATNR: '502573', MAKTX: 'UPPER>KTS320DGS01,LNW' }] };
    } else return Promise.reject(new Error('offline'));
    return Promise.resolve({ ok: true, json: function () { return Promise.resolve(body); } });
  };
  try {
    // 1) 마법사 4단계 — 🏭 버튼이 있고, 6자리 코드가 칸에 있으면 바로 조회하고 사람이 고르면 넣는다
    D.querySelectorAll('[id$="-overlay"]').forEach(function (x) { if (x.style) x.style.display = 'none'; });
    var host = D.createElement('div'); D.body.appendChild(host);
    host.innerHTML = '<input id="npw-model" value="STELLAR32"><input id="npw-ktkpn" value="">';
    var ktk = D.getElementById('npw-ktkpn'), inputs = 0;
    ktk.addEventListener('input', function () { inputs++; });
    ktk.value = '502574';
    W._sapPnFind(ktk, 'STELLAR32');
    await sleep(300);
    var ov = D.getElementById('sap-pn-find-overlay');
    chk(ov && ov.style.display === 'block', '창이 열린다');
    chk(calls.length === 1 && /sap-material-rows\?materials=502574/.test(calls[0]), '칸에 6자리 코드가 있으면 그 코드로 바로 조회(ZMM009) — ' + calls[0]);
    chk(ktk.value === '502574', '1건이어도 자동으로 넣지 않는다(사람이 고른다)');
    var row = D.querySelector('#sap-pn-find-list [data-i="0"]');
    chk(!!row && /502574/.test(row.textContent) && /KTS320DPS01/.test(row.textContent), '결과 줄에 코드(앞 0 뗌)·내역');
    row.click();
    chk(ktk.value === '502574_MAIN>KTS320DPS01,LNW', '고르면 사내 형식 코드_내역으로 넣는다 — ' + ktk.value);
    chk(inputs >= 1 && ov.style.display === 'none', 'input 이벤트를 내고 창을 닫는다');
    // 2) 글자로 찾기 — 대문자로 바꿔 *글자* 패턴
    calls.length = 0; ktk.value = '';
    W._sapPnFind(ktk, 'kts320');
    await sleep(100);
    chk(D.getElementById('sap-pn-find-q').value === 'kts320' && calls.length === 0, '코드가 없으면 힌트를 칸에 넣고 기다린다(자동 조회 안 함)');
    D.getElementById('sap-pn-find-go').click();
    await sleep(300);
    chk(calls.length === 1 && /sap-material-pattern\?pattern=\*KTS320\*/.test(decodeURIComponent(calls[0])), '글자는 대문자 *글자* 패턴으로 — ' + decodeURIComponent(calls[0] || ''));
    chk(D.querySelectorAll('#sap-pn-find-list [data-i]').length === 2 && ktk.value === '', '여러 건을 보여 주고 아무것도 넣지 않는다');
    D.querySelector('#sap-pn-find-list [data-i="1"]').click();
    chk(ktk.value === '502573_UPPER>KTS320DGS01,LNW', '두 번째를 고르면 그 값 — ' + ktk.value);
    // 3) SAP 오류는 그대로 보여 준다
    ktk.value = '999999'; W._sapPnFind(ktk, '');
    await sleep(300);
    chk(/SAP 로그인이 필요합니다/.test(D.getElementById('sap-pn-find-status').textContent) && ktk.value === '999999', 'SAP 오류 문구를 보여 주고 칸은 그대로');
    D.getElementById('sap-pn-find-overlay').style.display = 'none';
    // 4) Summary 모델 카드 — 진짜 렌더 함수가 그린 🏭 버튼을 누른다(고객 모델명이 힌트)
    var card = D.createElement('div'); D.body.appendChild(card);
    card.innerHTML = W._renderModelCardHtml({ 고객모델명: 'STELLAR32', KTK: '', unitId: '' }, 0);
    var kin = card.querySelector('[data-model-field="KTK"]');
    var btn = kin && kin.nextElementSibling;
    chk(!!btn && btn.textContent.indexOf('🏭') !== -1, 'Summary 모델 카드 KTK 칸 옆에 🏭 버튼');
    calls.length = 0; btn.click(); await sleep(100);
    chk(D.getElementById('sap-pn-find-q').value === 'STELLAR32', '카드의 고객 모델명이 검색어로 들어간다');
    D.getElementById('sap-pn-find-go').click(); await sleep(300);
    D.querySelector('#sap-pn-find-list [data-i="0"]').click();
    chk(kin.value === '502574_MAIN>KTS320DPS01,LNW', '고르면 그 카드의 KTK 칸에 — ' + kin.value);
    chk(kin.getBoundingClientRect().height <= 34 && btn.getBoundingClientRect().height <= 34, '칸·버튼이 한 줄(두 줄로 안 깨짐)');
    card.remove();   // ⚠️ 남겨 두면 Summary 카드 수집기가 페이지 전체를 훑어 이 시험 카드까지 거둔다(가짜 실패가 났다)
    // 5) Project list — 코드·내역이 다른 열이라 둘 다 채우고 변경 이력에 남긴다(진짜 plOpenPnMenu → plSapFindPn)
    var PD = W._plData || (W._plData = { rows: [], history: [] });
    PD.rows = PD.rows || []; PD.history = PD.history || [];
    var row = { _id: 'zz_sappn_test', no: '999', ktkPn: '', desc: 'STELLAR32' };
    PD.rows.push(row);
    var h0 = PD.history.length;
    calls.length = 0;
    W.plOpenPnMenu('zz_sappn_test');          // KTK PN 이 비었으면 메뉴 대신 바로 찾기
    await sleep(150);
    chk(D.getElementById('sap-pn-find-overlay').style.display === 'block' && D.getElementById('sap-pn-find-q').value === 'STELLAR32',
        '[Project list] KTK PN 이 비면 바로 SAP 찾기, Description 이 검색어');
    D.getElementById('sap-pn-find-go').click(); await sleep(300);
    D.querySelector('#sap-pn-find-list [data-i="0"]').click(); await sleep(100);
    chk(row.ktkPn === '502574' && row.desc === 'MAIN>KTS320DPS01,LNW', '[Project list] 고르면 KTK PN·Description 두 열을 채운다 — ' + row.ktkPn + ' / ' + row.desc);
    var hs = PD.history.slice(h0);
    chk(hs.some(function (h) { return h.f === 'ktkPn' && h.b === '' && h.a === '502574'; }) &&
        hs.some(function (h) { return h.f === 'desc' && h.b === 'STELLAR32'; }), '[Project list] 변경 이력에 전·후가 남는다(되돌릴 수 있게)');
    // 코드가 있으면 메뉴 맨 위에 찾기 항목
    W.plOpenPnMenu('zz_sappn_test'); await sleep(100);
    chk(/SAP 에서 KTK PN·Description 찾아 넣기/.test(D.body.innerHTML), '[Project list] 코드가 있으면 🏭 메뉴에 찾기 항목');
    if (W.plClosePopup) W.plClosePopup();
    PD.rows = PD.rows.filter(function (x) { return x._id !== 'zz_sappn_test'; });
    PD.history = PD.history.slice(0, h0);
    // 6) Document — 모델명세서의 MODEL NAME(meta.모델풀네임)·PART NUMBER(meta.제품코드) 칸, 진짜 _docRender 가 그린 링크
    W.switchTab('document'); await sleep(200);
    W._docState.formId = 'model-spec'; W._docRender(); await sleep(200);
    var body = D.getElementById('doc-page-body');
    var links = body.querySelectorAll('a[onclick*="_docSapPnFind"]');
    var keysWithLink = [].map.call(links, function (a) { return (a.getAttribute('onclick').match(/,'([^']+)'\)/) || [])[1]; });
    chk(keysWithLink.indexOf('MODEL NAME') !== -1 && keysWithLink.indexOf('PART NUMBER') !== -1, '[Document] 모델명·제품코드 칸에만 🏭 링크 — ' + keysWithLink.join(','));
    chk(!body.querySelector('[data-doc-key="BUYER NAME"]') || !/_docSapPnFind\([^)]*BUYER/.test(body.innerHTML), '[Document] 다른 칸엔 링크 없음');
    calls.length = 0;
    [].filter.call(links, function (a) { return /MODEL NAME/.test(a.getAttribute('onclick')); })[0].click();
    await sleep(150);
    D.getElementById('sap-pn-find-q').value = '502574';
    D.getElementById('sap-pn-find-go').click(); await sleep(300);
    D.querySelector('#sap-pn-find-list [data-i="0"]').click(); await sleep(200);
    var mn = body.querySelector('[data-doc-key="MODEL NAME"]'), pnIn = body.querySelector('[data-doc-key="PART NUMBER"]');
    chk(mn && mn.value === '502574_MAIN>KTS320DPS01,LNW' && pnIn && pnIn.value === '502574',
        '[Document] 고르면 두 칸을 함께 — MODEL NAME=' + (mn && mn.value) + ' / PART NUMBER=' + (pnIn && pnIn.value));
    chk(/직접 적음|edited/.test(mn.parentNode.textContent), '[Document] "직접 적음" 으로 표시되어 ↺ 로 되돌릴 수 있다');
    W._docResetField('model-spec', 'MODEL NAME'); W._docResetField('model-spec', 'PART NUMBER');
    // 7) Customer SPEC — 헤더 🏭 가 **지금 모델**의 Summary 모델 카드에만 넣는다(다른 모델은 그대로)
    W.tabData = W.tabData || {};
    var savedModels = W.tabData.projectModels, savedUnit = W.mcActiveUnit;
    W.tabData.projectModels = [
      { unitId: 'MVD', 고객모델명: 'STELLAR32', KTKPN: '111111', KTK모델명: 'OLD>MVD', 고객모델내역: '', 프로젝트코드: '', 프로젝트명칭: '' },
      { unitId: 'TPR', 고객모델명: 'TOPPER32',  KTKPN: '',       KTK모델명: '',        고객모델내역: '', 프로젝트코드: '', 프로젝트명칭: '' }];
    W.tabData.mcUnits = ['MVD', 'TPR'];
    W.renderProjectModels();
    W.mcActiveUnit = 'TPR';
    var bsBtn = D.getElementById('bs-sap-pn-btn');
    chk(!!bsBtn && bsBtn.closest('#tab-briefspec .concept-header-box'), '[Customer SPEC] 헤더에 🏭 KTK PN 버튼');
    bsBtn.click(); await sleep(150);
    chk(D.getElementById('sap-pn-find-q').value === 'TOPPER32', '[Customer SPEC] 지금 모델(TPR)의 고객 모델명이 검색어');
    D.getElementById('sap-pn-find-go').click(); await sleep(300);
    D.querySelector('#sap-pn-find-list [data-i="0"]').click(); await sleep(150);
    var pm = W.tabData.projectModels;
    chk(pm[1].KTKPN === '502574' && pm[1].KTK모델명 === 'MAIN>KTS320DPS01,LNW', '[Customer SPEC] TPR 카드에 코드·모델명');
    chk(pm[0].KTKPN === '111111' && pm[0].KTK모델명 === 'OLD>MVD', '[Customer SPEC] 다른 모델(MVD)은 그대로');
    var cardInputs = D.querySelectorAll('#sum-models-container [data-model-field="KTK"]');
    chk(cardInputs.length === 2 && cardInputs[1].value === '502574_MAIN>KTS320DPS01,LNW', '[Customer SPEC] Summary 화면 카드도 다시 그려져 같은 값(다음 저장이 되돌리지 않게) — ' + 'models=' + W.tabData.projectModels.length + ' containers=' + D.querySelectorAll('#sum-models-container').length + ' inputs=' + cardInputs.length + ':' + [].map.call(cardInputs, function (x) { return x.value; }).join('|'));
    var after = W._syncProjectModelsFromDom();
    chk(after[1].KTKPN === '502574', '[Customer SPEC] 화면에서 다시 거둬도 값이 남는다');
    // 카드가 없는 모델이면 지어내지 않고 알린다
    W.mcActiveUnit = 'BTN'; D.getElementById('sap-pn-find-overlay').style.display = 'none';
    bsBtn.click(); await sleep(100);
    chk(D.getElementById('sap-pn-find-overlay').style.display === 'none', '[Customer SPEC] 그 모델 카드가 없으면 창을 안 열고 알린다');
    // 8) M.C Table — 같은 헤더 버튼(데이터 MODEL_PN_HEADER_TARGETS), 제품구분자 바 바로 뒤
    var mcBtn = D.getElementById('mc-sap-pn-btn');
    chk(!!mcBtn && mcBtn.closest('#tab-mctable .concept-header-box') && mcBtn.previousElementSibling && mcBtn.previousElementSibling.id === 'mc-unit-bar',
        '[M.C Table] 헤더 제품구분자 바 바로 뒤에 🏭 KTK PN');
    W.tabData.projectModels = [
      { unitId: 'MVD', 고객모델명: 'STELLAR32', KTKPN: '', KTK모델명: '', 고객모델내역: '', 프로젝트코드: '', 프로젝트명칭: '' },
      { unitId: 'TPR', 고객모델명: 'TOPPER32',  KTKPN: '', KTK모델명: '', 고객모델내역: '', 프로젝트코드: '', 프로젝트명칭: '' }];
    W.renderProjectModels(); W.mcActiveUnit = 'MVD';
    D.getElementById('sap-pn-find-overlay').style.display = 'none';
    mcBtn.click(); await sleep(150);
    chk(D.getElementById('sap-pn-find-q').value === 'STELLAR32', '[M.C Table] 지금 모델(MVD)의 고객 모델명이 검색어');
    D.getElementById('sap-pn-find-go').click(); await sleep(300);
    D.querySelector('#sap-pn-find-list [data-i="1"]').click(); await sleep(150);
    chk(W.tabData.projectModels[0].KTKPN === '502573' && W.tabData.projectModels[1].KTKPN === '', '[M.C Table] MVD 카드에만 넣는다');
    // 9) 내역으로 찾기 — 📝 버튼은 6자리가 섞여 있어도 내역 패턴, 낱말은 * 로, code_내역 은 코드 떼고
    var dkt = D.createElement('input'); D.body.appendChild(dkt);
    W._sapPnFind(dkt, ''); await sleep(80);
    var qq = D.getElementById('sap-pn-find-q'), descBtn = D.getElementById('sap-pn-find-desc');
    chk(!!descBtn, '[내역] 📝 내역으로 버튼');
    calls.length = 0; qq.value = 'MAIN KTS320 LNW'; descBtn.click(); await sleep(300);
    chk(/pattern=\*MAIN\*KTS320\*LNW\*$/.test(decodeURIComponent(calls[0] || '')), '[내역] 띄어 쓴 낱말은 * 로 — ' + decodeURIComponent(calls[0] || ''));
    calls.length = 0; qq.value = '502574_MAIN>KTS320'; descBtn.click(); await sleep(300);
    chk(/sap-material-pattern\?pattern=\*MAIN>KTS320\*$/.test(decodeURIComponent(calls[0] || '')), '[내역] code_내역 을 붙여 넣으면 코드 떼고 내역만 — ' + decodeURIComponent(calls[0] || ''));
    calls.length = 0; qq.value = 'PANEL 123456 ASSY'; descBtn.click(); await sleep(300);
    chk(calls.length === 1 && /sap-material-pattern/.test(calls[0]), '[내역] 6자리가 섞여 있어도 📝 는 내역으로(코드 조회 안 함)');
    calls.length = 0; qq.value = 'Obsidian'; D.getElementById('sap-pn-find-go').click(); await sleep(400);
    chk(calls.length === 2 && /OBSIDIAN/.test(decodeURIComponent(calls[0])) && /Obsidian/.test(decodeURIComponent(calls[1]))
        && D.querySelectorAll('#sap-pn-find-list [data-i]').length === 1, '[내역] 대문자로 0건이면 원래 글자로 한 번 더 찾는다');
    D.getElementById('sap-pn-find-overlay').style.display = 'none'; dkt.remove();
    W.tabData.projectModels = savedModels; W.mcActiveUnit = savedUnit; if (savedModels) W.renderProjectModels();
  } catch (e) { out.push('ERROR ' + e.message); }
  out.push(pass + '/' + (pass + fail));
  document.getElementById('out').textContent = out.join('\n');
};
</script></body></html>
