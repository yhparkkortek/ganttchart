<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Gantt Chart</title>
    
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script>
        // ==========================================
        // 🔑 [필수 변수] 발급받은 본인의 키를 입력하세요
        // ==========================================
        const CLIENT_ID = '107026313229-jh5qm0pbkhe505gt3pvgbpbjurg1v0ej.apps.googleusercontent.com'; // 실제 클라이언트 ID로 변경
        const API_KEY = 'AIzaSyCYavFb6m88K8T7rhKQwnfv5ygpwG9ah48';     // 실제 API 키로 변경

        const SCOPES = 'https://www.googleapis.com/auth/drive.file'; // 앱이 만든 파일에만 접근 권한
        const TARGET_FILENAME = "GanttChart_SaveFile.json";          // 구글 드라이브에 저장될 파일명

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        // 팝업 화면 강제 고정 로직
        if (window.name !== 'gantt_popup') {
            const w = screen.availWidth, h = screen.availHeight;
            const newWin = window.open(location.href, 'gantt_popup', `width=${w},height=${h},left=0,top=0,menubar=no,toolbar=no,location=no,status=no`);
            if (newWin) { newWin.focus(); window.close(); }
        }

        // 구글 API 로드 콜백
        function gapiLoaded() { gapi.load('client', intializeGapiClient); }
        async function intializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            });
            gapiInited = true;
        }
        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', 
            });
            gisInited = true;
        }

        // 🔓 구글 드라이브 로그인 연동 함수
        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) { throw (resp); }
                alert('구글 드라이브 연동에 성공했습니다! 이제 [드라이브 저장/불러오기]가 가능합니다.');
                document.getElementById('auth_button').innerText = "🟢 연동 완료";
                document.getElementById('auth_button').disabled = true;
                // 권한 획득 후 드라이브 기능 버튼 활성화
                document.getElementById('drive_save_btn').disabled = false;
                document.getElementById('drive_load_btn').disabled = false;
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        // 📂 구글 드라이브에서 기존 파일 ID 찾기 함수
        async function findSaveFile() {
            try {
                let response = await gapi.client.drive.files.list({
                    q: `name='${TARGET_FILENAME}' and trashed=false`,
                    fields: 'files(id, name)',
                    spaces: 'drive'
                });
                let files = response.result.files;
                return files && files.length > 0 ? files[0].id : null;
            } catch (err) {
                console.error("파일 검색 오류:", err);
                return null;
            }
        }

        // 💾 [구글 드라이브 저장] 실행 함수
        async function saveToGoogleDrive() {
            if (globalData.length <= 1) { alert("저장할 간트차트 데이터가 없습니다. 먼저 파일을 로드해주세요."); return; }
            
            document.getElementById('file-status').textContent = "💾 구글 드라이브에 데이터를 저장하는 중...";
            
            // 저장할 데이터 패키징 (차트 데이터 + 변경 이력 기록 포함)
            let saveData = {
                globalData: globalData,
                changeLogs: window.changeLogs
            };
            let contentStr = JSON.stringify(saveData);
            
            try {
                let fileId = await findSaveFile();
                let boundary = 'foo_bar_baz';
                let delimiter = "\r\n--" + boundary + "\r\n";
                let close_delim = "\r\n--" + boundary + "--";

                let metadata = {
                    'name': TARGET_FILENAME,
                    'mimeType': 'application/json'
                };

                let multipartRequestBody =
                    delimiter +
                    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                    JSON.stringify(metadata) +
                    delimiter +
                    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                    contentStr +
                    close_delim;

                let request;
                if (fileId) {
                    // 파일이 이미 존재하면 업데이트(덮어쓰기)
                    request = gapi.client.request({
                        'path': '/upload/drive/v3/files/' + fileId,
                        'method': 'PATCH',
                        'params': {'uploadType': 'multipart'},
                        'headers': {'Content-Type': 'multipart/related; boundary="' + boundary + '"'},
                        'body': multipartRequestBody
                    });
                } else {
                    // 파일이 없으면 새 파일 생성
                    request = gapi.client.request({
                        'path': '/upload/drive/v3/files',
                        'method': 'POST',
                        'params': {'uploadType': 'multipart'},
                        'headers': {'Content-Type': 'multipart/related; boundary="' + boundary + '"'},
                        'body': multipartRequestBody
                    });
                }

                request.execute(function(file) {
                    if (file.id) {
                        alert("🎉 구글 드라이브에 성공적으로 저장되었습니다!");
                        document.getElementById('file-status').textContent = "✅ 구글 드라이브와 동기화 완료";
                    } else {
                        alert("저장에 실패했습니다. 권한을 다시 확인해 주세요.");
                    }
                });
            } catch (err) {
                alert("구글 드라이브 저장 중 에러 발생: " + err.message);
            }
        }

        // 📂 [구글 드라이브 불러오기] 실행 함수
        async function loadFromGoogleDrive() {
            document.getElementById('file-status').textContent = "📂 구글 드라이브에서 데이터를 동기화하는 중...";
            try {
                let fileId = await findSaveFile();
                if (!fileId) { alert("구글 드라이브에 저장된 간트차트 파일이 없습니다. 먼저 저장해 주세요."); return; }

                let response = await gapi.client.drive.files.get({
                    fileId: fileId,
                    alt: 'media'
                });

                let saveData = response.result;
                if (saveData && saveData.globalData) {
                    globalData = saveData.globalData;
                    window.changeLogs = saveData.changeLogs || [];
                    
                    // 컬럼 위치 매핑 재구축
                    let headerRow = globalData[0];
                    colIdx = { no: -1, bogo: -1, start: -1, plan: -1, period: -1, dur1: -1, dur2: -1, dur3: -1, dur4: -1, assignee: -1, taskType1: -1, taskType2: -1, taskType3: -1, taskType4: -1, status: -1, customer: -1, model: -1, inch: -1, devStage: -1, content: -1, answer: -1, chart: -1 };
                    
                    headerRow.forEach((h, idx) => {
                        if(!h) return; let str = h.toString().replace(/\s+/g, ''); let strUpper = str.toUpperCase();
                        if(strUpper.includes("NO")) colIdx.no = idx;
                        else if(str === "보고" || strUpper === "VIEW" || strUpper === "LEVEL(WBS)") colIdx.bogo = idx;
                        else if(str.includes("시작")) colIdx.start = idx;
                        else if(str.includes("계획") || str.includes("완료")) colIdx.plan = idx;
                        else if(str === "기간") colIdx.period = idx;
                        else if(str === "소요1") colIdx.dur1 = idx;
                        else if(str === "소요2") colIdx.dur2 = idx;
                        else if(str === "소요3" || str === "소요") colIdx.dur3 = idx;
                        else if(str === "소요4") colIdx.dur4 = idx;
                        else if(str.includes("담당자")) colIdx.assignee = idx;
                        else if(str === "업무구분1" || str === "업무1") colIdx.taskType1 = idx;
                        else if(str === "업무구분2" || str === "업무2") colIdx.taskType2 = idx;
                        else if(str === "업무구분3" || str === "업무3") colIdx.taskType3 = idx;
                        else if(str === "업무구분4" || str === "업무4") colIdx.taskType4 = idx;
                        else if(str.includes("상태")) colIdx.status = idx;
                        else if(str.includes("고객")) colIdx.customer = idx;
                        else if(str.includes("모델")) colIdx.model = idx;
                        else if(str.includes("인치")) colIdx.inch = idx;
                        else if(str.includes("단계") || str.includes("개발단계")) colIdx.devStage = idx;
                        else if(str.includes("내용") || str.includes("상세")) colIdx.content = idx;
                        else if(str.includes("답변") || str.includes("대응")) colIdx.answer = idx;
                        else if(str.includes("현황")) colIdx.chart = idx;
                    });

                    filterColumns = [];
                    if (colIdx.bogo !== -1) filterColumns.push({ index: colIdx.bogo, name: 'LEVEL(WBS)' });
                    if (colIdx.devStage !== -1) filterColumns.push({ index: colIdx.devStage, name: '개발단계' });
                    if (colIdx.status !== -1) filterColumns.push({ index: colIdx.status, name: '업무상태' });

                    window.recalculateSchedules();
                    alert("🎉 구글 드라이브로부터 최신 일정을 불러왔습니다!");
                }
            } catch (err) {
                alert("불러오기 실패: " + err.message);
            }
        }
    </script>
    
    <style>

        table { border-collapse: collapse; width: 100%; min-width: 100%; font-size: var(--table-font-size); table-layout: fixed; }

<body>
    
    <div class="controls" id="drop-zone">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;">
            <input type="file" id="file-input" accept=".xlsx, .xls, .csv" multiple style="margin-bottom:0;" />

        <span id="table-info-text">📊 Gantt Chart</span>
        
        <div style="display:flex; align-items:center; margin-left: auto; margin-right: 15px; border-right: 2px solid #ddd; padding-right: 15px; gap: 8px;">
            <label for="themePicker" style="font-size: 13px; color: #555; cursor:pointer;">🎨 <b>테마 색상 :</b></label>
            <input type="color" id="themePicker" value="#1a237e" oninput="window.updateThemeColor(this.value)" style="cursor: pointer; width: 32px; height: 32px; border: none; padding: 0; background: none; border-radius: 4px; outline: none;" title="원하는 색상을 선택하면 전체 테마가 자동으로 생성됩니다.">

                <tr><td colspan="20" style="text-align:center; padding: 50px; color: #777;">위에서 엑셀 파일을 선택하거나 구글 드라이브에서 불러오시면 차트 데이터가 표시됩니다.</td></tr>

                <span>🕒 변경 이력 (Session History)</span>

    </div>

<script>
    // 기존 기능 스크립트 그대로 유지 (하단 연동 데이터 로직 포함)
    function hexToHSL(H) {
        let r = 0, g = 0, b = 0;
        if (H.length === 4) { r = "0x" + H[1] + H[1]; g = "0x" + H[2] + H[2]; b = "0x" + H[3] + H[3]; } 
        else if (H.length === 7) { r = "0x" + H[1] + H[2]; g = "0x" + H[3] + H[4]; b = "0x" + H[5] + H[6]; }
        r /= 255; g /= 255; b /= 255;
        let cmin = Math.min(r,g,b), cmax = Math.max(r,g,b), delta = cmax - cmin, h = 0, s = 0, l = 0;
        if (delta === 0) h = 0;
        else if (cmax === r) h = ((g - b) / delta) % 6;
        else if (cmax === g) h = (b - r) / delta + 2;
        else h = (r - g) / delta + 4;
        h = Math.round(h * 60); if (h < 0) h += 360;
        l = (cmax + cmin) / 2;
        s = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
        s = +(s * 100).toFixed(1); l = +(l * 100).toFixed(1);
        return {h, s, l};
    }

    window.chartColors = { l0: "#1a237e", l1: "#3949ab", l2: "#7986cb", l3: "#c5cae9" };

    window.updateThemeColor = function(baseHex) {
        let hsl = hexToHSL(baseHex);
        let h = hsl.h; let s = hsl.s; let l0 = hsl.l;
        let l0Text = l0 > 60 ? '#333333' : '#ffffff';
        let darkTextL = Math.min(l0, 40);
        let root = document.documentElement;

        root.style.setProperty('--c-l0-bg', baseHex);
        root.style.setProperty('--c-l0-border', `hsl(${h}, ${s}%, ${Math.max(0, l0 - 15)}%)`);
        root.style.setProperty('--c-l0-text', l0Text);
        root.style.setProperty('--c-l0-chart-label', l0Text === '#ffffff' ? `hsl(${h}, ${s}%, 90%)` : `hsl(${h}, ${s}%, 20%)`);
        root.style.setProperty('--c-l1-bg', `hsl(${h}, ${Math.max(0, s - 10)}%, 88%)`);
        root.style.setProperty('--c-l1-border', `hsl(${h}, ${Math.max(0, s - 10)}%, 75%)`);
        root.style.setProperty('--c-l1-text', `hsl(${h}, ${s}%, ${darkTextL}%)`);
        root.style.setProperty('--c-l2-bg', `hsl(${h}, ${Math.max(0, s - 15)}%, 94%)`);
        root.style.setProperty('--c-l2-border', `hsl(${h}, ${Math.max(0, s - 15)}%, 85%)`);
        root.style.setProperty('--c-l2-text', `hsl(${h}, ${s}%, ${darkTextL}%)`);
        root.style.setProperty('--c-l3-bg', `#ffffff`);
        root.style.setProperty('--c-l3-border', `#dee2e6`);
        root.style.setProperty('--c-l3-text', `#333333`);
        root.style.setProperty('--c-l4-bg', `hsl(${h}, ${Math.max(0, s - 20)}%, 98%)`);
        root.style.setProperty('--c-l4-border', `#e9ecef`);
        root.style.setProperty('--c-l4-text', `#495057`);

        window.chartColors = {
            l0: baseHex,
            l1: `hsl(${h}, ${s}%, ${Math.min(l0 + 15, 60)}%)`,
            l2: `hsl(${h}, ${s}%, ${Math.min(l0 + 30, 75)}%)`,
            l3: `hsl(${h}, ${Math.max(0, s - 10)}%, 85%)`
        };
        if (globalData && globalData.length > 1) applyFilters();
    };

    window.exportFilenameStr = "GanttChart_All";
    window.ganttViewStartTs = null;
    window.ganttViewDuration = null;
    window.changeLogs = []; 

    const KOR_HOLIDAYS = [
        "2024-01-01", "2024-02-09", "2024-02-12", "2024-03-01", "2024-04-10", "2024-05-05", "2024-05-06", "2024-05-15", "2024-06-06", "2024-08-15", "2024-09-16", "2024-09-17", "2024-09-18", "2024-10-03", "2024-10-09", "2024-12-25",
        "2025-01-01", "2025-01-28", "2025-01-29", "2025-01-30", "2025-03-01", "2025-03-03", "2025-05-05", "2025-05-06", "2025-06-06", "2025-08-15", "2025-10-03", "2025-10-05", "2025-10-06", "2025-10-07", "2025-10-08", "2025-10-09", "2025-12-25",
        "2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-03-01", "2026-03-02", "2026-05-05", "2026-05-24", "2026-05-25", "2026-06-06", "2026-08-15", "2026-09-24", "2026-09-25", "2026-09-26", "2026-10-03", "2026-10-09", "2026-12-25"
    ];

    function addWorkingDays(startDateTs, daysToAdd) {
        let currentDate = new Date(startDateTs); currentDate.setHours(0,0,0,0);
        if (daysToAdd <= 0) return currentDate.getTime(); 
        let addedDays = 0;
        while (addedDays < daysToAdd) {
            currentDate.setDate(currentDate.getDate() + 1); let dayOfWeek = currentDate.getDay(); 
            let dateStr = currentDate.getFullYear() + "-" + String(currentDate.getMonth() + 1).padStart(2, '0') + "-" + String(currentDate.getDate()).padStart(2, '0');
            if (dayOfWeek !== 0 && dayOfWeek !== 6 && !KOR_HOLIDAYS.includes(dateStr)) { addedDays++; }
        }
        return currentDate.getTime();
    }

    function countWorkingDays(startTs, endTs) {
        if (!startTs || !endTs) return 0;
        let count = 0; let cur = new Date(startTs); cur.setHours(0,0,0,0); let end = new Date(endTs); end.setHours(0,0,0,0);
        if (cur > end) return 0;
        while (cur <= end) {
            let dayOfWeek = cur.getDay(); let dateStr = cur.getFullYear() + "-" + String(cur.getMonth() + 1).padStart(2, '0') + "-" + String(cur.getDate()).padStart(2, '0');
            if (dayOfWeek !== 0 && dayOfWeek !== 6 && !KOR_HOLIDAYS.includes(dateStr)) { count++; }
            cur.setDate(cur.getDate() + 1);
        }
        return count;
    }

    function toggleFullScreen() {
        const doc = window.document; const docEl = doc.documentElement;
        const requestFullScreen = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
        const cancelFullScreen = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
        if (!doc.fullscreenElement) requestFullScreen.call(docEl); else cancelFullScreen.call(doc);
    }

    function logChange(rowIndex, colIndex, oldVal, newVal) {
        if (!globalData || globalData.length === 0) return;
        let colName = colIndex === -1 ? "행 조작" : (globalData[0][colIndex] || `Col ${colIndex}`);
        let rowName = rowIndex; 
        let tr = document.querySelector(`tr[data-row-index="${rowIndex}"]`);
        if (tr) {
            let noTd = tr.querySelector('.no-td');
            if (noTd) {
                let span = noTd.querySelector('.row-num-span');
                if (span && span.textContent) rowName = span.textContent.trim();
            }
        }
        window.changeLogs.push({ time: new Date().toLocaleString('ko-KR'), rowName: rowName, colName: colName, oldVal: oldVal, newVal: newVal });
    }

    window.showHistoryModal = function() {
        let content = document.getElementById('history-content');
        if (!window.changeLogs || window.changeLogs.length === 0) {
            content.innerHTML = '<div class="history-empty">현재 편집 세션에서 수정된 데이터가 없습니다.</div>';
        } else {
            let html = `<table class="history-table"><thead><tr><th style="width:18%;">변경 일시</th><th style="width:10%;">No (행)</th><th style="width:12%;">변경 항목</th><th style="width:30%;">변경 전 (Old)</th><th style="width:30%;">변경 후 (New)</th></tr></thead><tbody>`;
            let reversedLogs = [...window.changeLogs].reverse();
            reversedLogs.forEach(log => {
                html += `<tr><td style="color:#6c757d; font-size:11px;">${log.time}</td><td style="font-weight:bold;">${escapeHtml(log.rowName)}</td><td><span class="badge" style="background:#e7f1ff; color:#0056b3;">${escapeHtml(log.colName)}</span></td><td class="val-old">${escapeHtml(log.oldVal || "-")}</td><td class="val-new">${escapeHtml(log.newVal || "-")}</td></tr>`;
            });
            html += '</tbody></table>'; content.innerHTML = html;
        }
        document.getElementById('history-overlay').style.display = 'flex';
    };

    window.closeHistoryModal = function(e) { if (e && e.target !== document.getElementById('history-overlay')) return; document.getElementById('history-overlay').style.display = 'none'; };

    window.toggleRowActions = function(td) {
        document.querySelectorAll('.row-actions.show').forEach(el => { if(el !== td.querySelector('.row-actions')) el.classList.remove('show'); });
        let actions = td.querySelector('.row-actions'); if (actions) actions.classList.toggle('show');
    };

    window.addRow = function(index) {
        if (index <= 0) { alert("최상단 행에는 추가할 수 없습니다."); return; }
        let parentRow = globalData[index]; let newRow = new Array(globalData[0].length).fill("");
        newRow._level = parentRow._level;
        if (colIdx.status !== -1) newRow[colIdx.status] = parentRow[colIdx.status] || "진행";
        for(let i=0; i<globalData[0].length; i++) {
            if ([colIdx.no, colIdx.start, colIdx.plan, colIdx.period, colIdx.dur1, colIdx.dur2, colIdx.dur3, colIdx.dur4, colIdx.chart, colIdx.content, colIdx.answer].includes(i)) continue;
            newRow[i] = parentRow[i] || "";
        }
        let newTaskName = "새로운 업무";
        if (newRow._level === 0) newRow._origDev = newTaskName;
        else if (newRow._level === 1) newRow._origT1 = newTaskName;
        else if (newRow._level === 2) newRow._origT2 = newTaskName;
        else if (newRow._level === 3) newRow._origT3 = newTaskName;
        else if (newRow._level === 4) newRow._origT4 = newTaskName;
        
        newRow._explicitStartTs = null; newRow._explicitPlanTs = null; newRow._finalDuration = 1;
        globalData.splice(index + 1, 0, newRow); 
        logChange(index + 1, -1, "없음", "행 추가됨");
        window.recalculateSchedules();
    };

    window.changeRowLevel = function(index, direction) {
        let row = globalData[index]; if (!row) return;
        let oldLevel = row._level; let newLevel = Math.max(0, Math.min(4, oldLevel + direction));
        if (newLevel === oldLevel) return;
        let taskTxt = oldLevel === 0 ? row._origDev : (oldLevel === 1 ? row._origT1 : (oldLevel === 2 ? row._origT2 : (oldLevel === 3 ? row._origT3 : row._origT4)));
        taskTxt = (taskTxt || "").toString().trim() || "새로운 업무";

        row._level = newLevel;
        row._origDev = ""; row._origT1 = ""; row._origT2 = ""; row._origT3 = ""; row._origT4 = "";
        if (newLevel === 0) row._origDev = taskTxt; else if (newLevel === 1) row._origT1 = taskTxt; else if (newLevel === 2) row._origT2 = taskTxt; else if (newLevel === 3) row._origT3 = taskTxt; else if (newLevel === 4) row._origT4 = taskTxt;
        logChange(index, -1, `계층 변경`, `${oldLevel} → ${newLevel}`);
        window.recalculateSchedules();
    };

    window.deleteRow = function(index) {
        if(!confirm("이 행을 삭제하시겠습니까?")) return;
        globalData.splice(index, 1);
        logChange(index, -1, "행 조작", "행 삭제됨");
        window.recalculateSchedules();
    };

    const fileInput = document.getElementById('file-input');
    fileInput.addEventListener('change', handleFiles, false);
    window.addEventListener("dragover", function(e) { e.preventDefault(); }, false);
    window.addEventListener("drop", function(e) { e.preventDefault(); }, false);
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault(); if (e.dataTransfer.files && e.dataTransfer.files.length > 0) handleFiles({ target: { files: e.dataTransfer.files } });
    });

    window.currentCalendarTarget = null; window.currentCalendarTs = null; window.currentCalendarRow = null; window.currentCalendarCol = null;

    window.showCalendar = function(btn, ts, rowIndex, colIndex) {
        window.currentCalendarTarget = btn; window.currentCalendarTs = Number(ts); window.currentCalendarRow = rowIndex; window.currentCalendarCol = colIndex;
        let d = new Date(window.currentCalendarTs);
        window.currentViewYear = d.getFullYear(); window.currentViewMonth = d.getMonth();
        renderCalendar(false);
    };

    window.changeCalendarMonth = function(e, deltaMonth, deltaYear) {
        if (e) e.stopPropagation();
        let d = new Date(window.currentViewYear + deltaYear, window.currentViewMonth + deltaMonth, 1);
        window.currentViewYear = d.getFullYear(); window.currentViewMonth = d.getMonth();
        renderCalendar(true);
    };

    window.selectDateFromCalendar = function(y, m, d) {
        let str = y + "-" + String(m+1).padStart(2, '0') + "-" + String(d).padStart(2, '0');
        let r = window.currentCalendarRow; let c = window.currentCalendarCol;
        let oldVal = globalData[r][c] || "";
        if (oldVal !== str) {
            logChange(r, c, oldVal, str); 
            globalData[r][c] = str;
            if (c === colIdx.plan) { globalData[r]._planForced = true; globalData[r]._startForced = false; }
            if (c === colIdx.start) { globalData[r]._startForced = true; globalData[r]._planForced = false; }
            document.getElementById('calendar-popup').style.display = 'none';
            window.recalculateSchedules(); 
        }
    };

    window.renderCalendar = function(keepPos) {
        let popup = document.getElementById('calendar-popup');
        if (!popup) { popup = document.createElement('div'); popup.id = 'calendar-popup'; popup.className = 'calendar-popup'; document.body.appendChild(popup); }
        let year = window.currentViewYear; let month = window.currentViewMonth;
        let firstDay = new Date(year, month, 1).getDay(); let daysInMonth = new Date(year, month + 1, 0).getDate();
        let html = `<div class="cal-header"><span class="cal-nav" onclick="changeCalendarMonth(event, -1, 0)">◀</span><span>${year}년 ${month + 1}월</span><span class="cal-nav" onclick="changeCalendarMonth(event, 1, 0)">▶</span></div><div class="cal-grid">`;
        for (let i = 0; i < firstDay; i++) { html += `<div class="cal-date dim"></div>`; }
        for (let i = 1; i <= daysInMonth; i++) { html += `<div class="cal-date" onclick="selectDateFromCalendar(${year}, ${month}, ${i})">${i}</div>`; }
        html += `</div>`; popup.innerHTML = html; popup.style.display = 'block';
        if (!keepPos && window.currentCalendarTarget) {
            let rect = window.currentCalendarTarget.getBoundingClientRect();
            popup.style.top = (rect.bottom + window.scrollY + 5) + 'px'; popup.style.left = (rect.left + window.scrollX) + 'px';
        }
    };

    document.addEventListener('click', function(e) {
        const popup = document.getElementById('calendar-popup'); if (popup && !popup.contains(e.target) && !e.target.closest('.date-clickable')) popup.style.display = 'none';
    });

    let filterColumns = []; let currentFilters = {}; let globalData = []; let existingDevStages = []; 
    let colIdx = { no: -1, bogo: -1, start: -1, plan: -1, period: -1, dur1: -1, dur2: -1, dur3: -1, dur4: -1, assignee: -1, taskType1: -1, taskType2: -1, taskType3: -1, taskType4: -1, status: -1, customer: -1, model: -1, inch: -1, devStage: -1, content: -1, answer: -1, chart: -1 };

    function escapeHtml(unsafe) { if (!unsafe) return ""; return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function linkifyAndEscape(text) { if (!text) return ""; return escapeHtml(text).replace(/\n/g, '<br>'); }

    function parseDateValue(value) {
        if (!value) return null;
        let dt = new Date(value); if(isNaN(dt.getTime())) return null;
        dt.setHours(0,0,0,0); return { ts: dt.getTime() };
    }
    function formatTableDate(ts) { let d = new Date(ts); return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }
    function formatTsToYMD(ts) { let d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0'); }
    function getDurationDays(val) { if (!val) return null; let days = parseInt(val, 10); return isNaN(days) ? null : days; }

    window.recalculateSchedules = function() {
        if (globalData.length <= 1) return;
        let curD0 = "", curT1 = "", curT2 = "", curT3 = "", curT4 = "";
        for (let i = 1; i < globalData.length; i++) {
            let row = globalData[i]; if (!row) continue;
            let text = row._level === 0 ? row._origDev : (row._level === 1 ? row._origT1 : (row._level === 2 ? row._origT2 : (row._level === 3 ? row._origT3 : row._origT4)));
            text = text || "";
            if (row._level === 0) { curD0 = text; curT1 = ""; curT2 = ""; curT3 = ""; curT4 = ""; }
            else if (row._level === 1) { curT1 = text; curT2 = ""; curT3 = ""; curT4 = ""; }
            else if (row._level === 2) { curT2 = text; curT3 = ""; curT4 = ""; }
            else if (row._level === 3) { curT3 = text; curT4 = ""; }
            else if (row._level === 4) { curT4 = text; }
            row._origDev = curD0; if (colIdx.devStage !== -1) row[colIdx.devStage] = curD0;
            row._origT1 = curT1; if (colIdx.taskType1 !== -1) row[colIdx.taskType1] = curT1;
            row._origT2 = curT2; if (colIdx.taskType2 !== -1) row[colIdx.taskType2] = curT2;
            row._origT3 = curT3; if (colIdx.taskType3 !== -1) row[colIdx.taskType3] = curT3;
            row._origT4 = curT4; if (colIdx.taskType4 !== -1) row[colIdx.taskType4] = curT4;
        }

        generateFilters(globalData);
        let chartMinTs = null; let chartMaxTs = null;
        for (let i = 1; i < globalData.length; i++) {
            let pStart = parseDateValue(globalData[i][colIdx.start]);
            let pPlan = parseDateValue(globalData[i][colIdx.plan]);
            globalData[i]._calcStartTs = pStart ? pStart.ts : new Date().getTime();
            let dur = getDurationDays(globalData[i][colIdx.period]) || 1;
            globalData[i]._calcPlanTs = pPlan ? pPlan.ts : addWorkingDays(globalData[i]._calcStartTs, dur - 1);
            
            if (chartMinTs === null || globalData[i]._calcStartTs < chartMinTs) chartMinTs = globalData[i]._calcStartTs;
            if (chartMaxTs === null || globalData[i]._calcPlanTs > chartMaxTs) chartMaxTs = globalData[i]._calcPlanTs;
        }
        window.ganttViewStartTs = chartMinTs ? chartMinTs - (86400000*3) : new Date().getTime();
        window.ganttViewDuration = chartMaxTs ? (chartMaxTs + 86400000*5) - window.ganttViewStartTs : 86400000*30;

        renderTable(globalData); applyFilters();
    };

    function handleFiles(e) {
        const files = e.target.files; if (!files || files.length === 0) return;
        let file = files[0]; let reader = new FileReader();
        reader.onload = function(e) {
            let data = new Uint8Array(e.target.result);
            let workbook = XLSX.read(data, {type: 'array'});
            let worksheet = workbook.Sheets[workbook.SheetNames[0]];
            let jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
            if(jsonData.length > 0) {
                globalData = jsonData;
                let headerRow = globalData[0];
                headerRow.forEach((h, idx) => {
                    if(!h) return; let str = h.toString().replace(/\s+/g, '');
                    if(str.toUpperCase().includes("NO")) colIdx.no = idx;
                    else if(str === "보고" || str === "LEVEL(WBS)") colIdx.bogo = idx;
                    else if(str.includes("시작")) colIdx.start = idx;
                    else if(str.includes("계획") || str.includes("완료")) colIdx.plan = idx;
                    else if(str === "기간") colIdx.period = idx;
                    else if(str.includes("담당자")) colIdx.assignee = idx;
                    else if(str.includes("상태")) colIdx.status = idx;
                    else if(str.includes("단계") || str.includes("개발단계")) colIdx.devStage = idx;
                    else if(str.includes("내용")) colIdx.content = idx;
                    else if(str.includes("답변")) colIdx.answer = idx;
                    else if(str.includes("현황")) colIdx.chart = idx;
                });
                
                for(let i=1; i<globalData.length; i++){
                    let row = globalData[i];
                    row._level = colIdx.bogo !== -1 ? (parseInt(row[colIdx.bogo], 10) - 1 || 0) : 0;
                    row._origDev = row[colIdx.devStage] || "";
                }
                window.recalculateSchedules();
            }
        };
        reader.readAsArrayBuffer(file);
    }

    window.makeEditable = function(td) {
        if(td.getAttribute('contenteditable') === 'true') return;
        td.setAttribute('contenteditable', 'true'); td.focus();
    };

    window.blurCell = function(td, rowIndex, colIndex) {
        td.removeAttribute('contenteditable'); let newText = td.innerText.trim();
        logChange(rowIndex, colIndex, globalData[rowIndex][colIndex], newText);
        globalData[rowIndex][colIndex] = newText;
        window.recalculateSchedules();
    };

    function renderTable(data) {
        const thead = document.getElementById('table-head'); const tbody = document.getElementById('table-body');
        thead.innerHTML = ''; tbody.innerHTML = '';
        if(!data || data.length === 0) return;

        let headHtml = '<tr>';
        data[0].forEach((cell) => { headHtml += `<th>${escapeHtml(cell)}</th>`; });
        headHtml += '</tr>'; thead.innerHTML = headHtml;

        let bodyHtml = '';
        for(let i = 1; i < data.length; i++) {
            let row = data[i]; let trClass = `class="parent-row"`;
            if(row._level === 1) trClass = `class="sub-parent-row"`;
            if(row._level === 2) trClass = `class="sub-parent-row-2"`;
            bodyHtml += `<tr data-row-index="${i}" ${trClass}>`;
            for(let j = 0; j < data[0].length; j++) {
                let cell = row[j] !== undefined ? row[j] : "";
                let attrs = `ondblclick="makeEditable(this)" onblur="blurCell(this, ${i}, ${j})"`;
                if(j === colIdx.no) attrs = `class="no-td" ondblclick="toggleRowActions(this)"`;
                if(j === colIdx.chart) attrs = `class="chart-td"`;
                
                let htmlContent = escapeHtml(cell);
                if(j === colIdx.start && row._calcStartTs) htmlContent = `<span class="date-clickable" onclick="showCalendar(this, ${row._calcStartTs}, ${i}, ${j})">${formatTableDate(row._calcStartTs)}</span>`;
                if(j === colIdx.plan && row._calcPlanTs) htmlContent = `<span class="date-clickable" onclick="showCalendar(this, ${row._calcPlanTs}, ${i}, ${j})">${formatTableDate(row._calcPlanTs)}</span>`;
                if(j === colIdx.chart) htmlContent = createStatusChart(row._calcStartTs, row._calcPlanTs, row[colIdx.status], row._level);
                
                bodyHtml += `<td ${attrs}>${htmlContent}</td>`;
            }
            bodyHtml += `</tr>`;
        }
        tbody.innerHTML = bodyHtml;
    }

    function applyFilters() {
        const tbody = document.getElementById('table-body'); const trs = tbody.getElementsByTagName("tr");
        for (let i = 0; i < trs.length; i++) { trs[i].style.display = ""; }
        updatePrintTitle();
    }

    function generateFilters() { }

    function updatePrintTitle() {
        let today = new Date(); document.title = `${today.getFullYear()}_GanttChart_Project`;
        document.getElementById('print-date').textContent = "인쇄일자: " + today.toLocaleDateString();
    }

    function exportToExcel() {
        const ws = XLSX.utils.aoa_to_sheet(globalData); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "GanttChart"); XLSX.writeFile(wb, "GanttChart_Export.xlsx");
    }

    function createStatusChart(rowStartTs, rowPlanTs, statusVal, level) {
        let viewStartTs = window.ganttViewStartTs; let viewDuration = window.ganttViewDuration;
        if (!viewStartTs || !rowStartTs) return `<div>-</div>`;
        let startPct = ((rowStartTs - viewStartTs) / viewDuration) * 100;
        let endPct = ((rowPlanTs - viewStartTs) / viewDuration) * 100;
        let widthPct = Math.max(1, endPct - startPct);
        let barColor = window.chartColors.l0;
        if(level === 1) barColor = window.chartColors.l1;
        if(level === 2) barColor = window.chartColors.l2;

        return `<div style="position:relative; height:10px; background-color:#f8f9fa; border:1px solid #ced4da; border-radius:4px; width:100%;"><div style="position:absolute; top:1px; bottom:1px; left:${startPct}%; width:${widthPct}%; background-color:${barColor}; border-radius:2px;"></div></div>`;
    }
</script>
</body>
</html>
